# compose.yaml: the course app as three services (Lab 4, Part 2).
# Copy this file to the root of your fork:  cp lab04-multi-service-compose/compose.start.yaml compose.yaml
# Then fill in every blank (four underscores). The comment at the end of a line asks the question; the slide has the answer.
#   Step 2.2: the db service (active now).
#   Step 2.3: uncomment api: select its lines and press Ctrl+/ in VS Code.
#   Step 2.4: uncomment web the same way.
name: course-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_DB: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}   # which variable in .env? (slide 46)
    volumes:
      - pgdata:/var/lib/postgresql/data     # a named volume: which name? Declare it at the bottom too (slide 30)
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "todo", "-d", "todo"]   # runs INSIDE db (slide 37)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [back]                      # no ports: unreachable from the laptop
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

    networks: [front, back]
  web:
    build: ./web
    ports:
      - "8081:80"
    networks: [front]
    depends_on:
      api:
        condition: service_healthy

networks:
  front:
  back:

volumes:
  pgdata:
